# ---------------------------------------------------------------------------
# MLOps Pipeline: Tourism Package Prediction
# Triggered on every push to the main branch.
# Runs the full ML workflow: data registration, data preparation,
# model training, and deployment on a single runner.
# ---------------------------------------------------------------------------
name: Tourism Package MLOps Pipeline

on:
  push:
    branches:
      - main

jobs:
  data-registration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install datasets huggingface_hub pandas

      - name: Recreate project folder structure
        run: |
          mkdir -p tourism_project/data
          mkdir -p tourism_project/model_building
          mkdir -p tourism_project/deployment
          cp data/tourism.csv tourism_project/data/
          cp model_building/*.py tourism_project/model_building/
          cp deployment/* tourism_project/deployment/

      - name: Run data registration
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python tourism_project/model_building/data_register.py

  data-preparation:
    needs: data-registration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install datasets huggingface_hub pandas scikit-learn

      - name: Recreate project folder structure
        run: |
          mkdir -p tourism_project/data
          mkdir -p tourism_project/model_building
          mkdir -p tourism_project/deployment
          cp data/tourism.csv tourism_project/data/
          cp model_building/*.py tourism_project/model_building/
          cp deployment/* tourism_project/deployment/

      - name: Run data preparation
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python tourism_project/model_building/prep.py

  model-training:
    needs: data-preparation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install datasets huggingface_hub pandas scikit-learn xgboost mlflow joblib dill

      - name: Start MLflow server
        run: mlflow server --host 0.0.0.0 --port 5000 &

      - name: Wait for MLflow server
        run: sleep 5

      - name: Recreate project folder structure
        run: |
          mkdir -p tourism_project/data
          mkdir -p tourism_project/model_building
          mkdir -p tourism_project/deployment
          cp data/tourism.csv tourism_project/data/
          cp model_building/*.py tourism_project/model_building/
          cp deployment/* tourism_project/deployment/

      - name: Download prepared data from HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from datasets import load_dataset
          import pandas as pd
          ds = load_dataset('NiiOsa1/tourism-package-prediction-splits')
          train_df = ds['train'].to_pandas()
          test_df = ds['test'].to_pandas()
          train_df.drop(columns=['ProdTaken']).to_csv('Xtrain.csv', index=False)
          train_df[['ProdTaken']].to_csv('ytrain.csv', index=False)
          test_df.drop(columns=['ProdTaken']).to_csv('Xtest.csv', index=False)
          test_df[['ProdTaken']].to_csv('ytest.csv', index=False)
          print('Data downloaded from HF and saved as CSVs')
          "

      - name: Run model training
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python tourism_project/model_building/train.py

  deployment:
    needs: model-training
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install huggingface_hub

      - name: Recreate project folder structure
        run: |
          mkdir -p tourism_project/data
          mkdir -p tourism_project/model_building
          mkdir -p tourism_project/deployment
          cp data/tourism.csv tourism_project/data/
          cp model_building/*.py tourism_project/model_building/
          cp deployment/* tourism_project/deployment/

      - name: Run deployment
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python tourism_project/model_building/host.py
